# Default scorer bundle (the registered scorers the GRPO cascade uses by name). The structure
# backend is `structure_auto` (Boltz-2 open, or Protenix v2 if licensed weights are present),
# followed by the Rosetta interface scorer. See configs/scorer/{structure_auto,boltz2,protenix,
# rosetta_interface}.yaml for each backend's settings.
cascade:
  - structure_auto
  - rosetta_interface
