[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-geometry"
version = "0.0.0"
description = "Identity, cause, and truth-vs-confidence in biological foundation models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "project authors" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Phase 0 needs only numpy. Later phases add these (kept optional so the skeleton installs cleanly).
full = [
  "torch>=2.2",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "mdtraj>=1.9",        # backbone dihedrals / SASA from structures
  "biotite>=0.40",      # structure / DSSP handling
  "geoopt>=0.5",        # manifold (sphere / torus) parameterizations — control baselines only
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md"]
