[project]
name = "aapg-validation"
version = "0.0.0"
description = "Module 3: validation pipeline — backbones -> ProteinMPNN -> Protenix v2 -> OpenDDE -> verdict."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aapg-core",
    "aapg-toolkit",
    "proteinmpnn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
