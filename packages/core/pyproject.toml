[project]
name = "aapg-core"
version = "0.0.0"
description = "Shared, pure library for the all-atom protein generation monorepo (structure I/O, geometry, metrics, scoring registry)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # torch and heavy structure libs are added when real model code lands; the
    # skeleton stays light so CI and imports are fast.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PEP 420 namespace: ship the `aapg/core` subtree with no `aapg/__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
