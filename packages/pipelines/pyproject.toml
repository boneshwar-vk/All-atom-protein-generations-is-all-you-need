[project]
name = "aapg-pipelines"
version = "0.0.0"
description = "End-to-end orchestration: compose the four modules into generate / design / validate / end2end runs (Hydra entrypoints)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aapg-core",
    "aapg-ellipsoid",
    "aapg-grpo",
    "aapg-mpnn-iter",
    "aapg-validation",
    # Hydra is added when the entrypoints are implemented; stubs stay import-light for now.
]

[project.scripts]
aapg-end2end = "aapg.pipelines.end2end:main"
aapg-generate = "aapg.pipelines.generate:main"
aapg-design = "aapg.pipelines.design:main"
aapg-validate = "aapg.pipelines.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
