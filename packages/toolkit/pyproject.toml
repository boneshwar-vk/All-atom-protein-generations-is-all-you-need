[project]
name = "aapg-toolkit"
version = "0.0.0"
description = "Adapters to external protein tools (Rosetta, Protenix v2, OpenDDE, ESM, TM-align, Foldseek), behind aapg.core scoring interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aapg-core",
    # Heavy/optional tool clients are added per-adapter; most tools run in their own container
    # and are invoked via subprocess, so no heavy Python deps live here by default.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
