[project]
name = "aapg-grpo"
version = "0.0.0"
description = "Module 1: online GRPO steering of RFDiffusion3 sampling using a reward computed from scored structures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aapg-core",
    "rfdiffusion3",
    # Optionally steers the ellipsoid-conditioned sampler; dependency added when wired.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
