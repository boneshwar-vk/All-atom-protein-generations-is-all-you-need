[project]
name = "aapg-grpo"
version = "0.0.0"
description = "Module 1: online GRPO steering of RFDiffusion3 sampling using a reward computed from scored structures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aapg-core",
    "aapg-toolkit",
    "aapg-score-head",
    "rfdiffusion3",
    "proteinmpnn",
    "numpy>=1.26",
    # Optionally steers the ellipsoid-conditioned sampler; dependency added when wired.
]

# Optional: Hydra config composition and polars Parquet output. Both are lazily imported, so
# the package runs (mock pipeline, tests, CLI argparse fallback, JSONL output) without them.
[project.optional-dependencies]
full = ["hydra-core", "polars"]

[project.scripts]
aapg-grpo = "aapg.grpo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
