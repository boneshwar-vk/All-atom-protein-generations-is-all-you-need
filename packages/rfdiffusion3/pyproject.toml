[project]
name = "rfdiffusion3"
version = "0.0.0"
description = "Vendored fork of RFdiffusion3 (RFD3). Edited upstream for ellipsoid conditioning (module 2). Keeps the upstream import name."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The adapter parses PDB CA traces into numpy arrays at import time (adapter.py), so numpy is
    # a hard dependency. Upstream RFD3 deps (torch, etc.) are declared when the source is actually
    # vendored -- see VENDORING.md for the procedure.
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfdiffusion3"]
