[project]
name = "proteinmpnn"
version = "0.0.0"
description = "Vendored fork of ProteinMPNN. Edited upstream for the iterative optimization loop (module 4). Keeps the upstream import name."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upstream ProteinMPNN deps (torch, etc.) are declared when the source is actually vendored.
    # See VENDORING.md for the procedure.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinmpnn"]
