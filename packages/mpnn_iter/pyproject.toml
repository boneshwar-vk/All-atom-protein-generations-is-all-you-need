[project]
name = "aapg-mpnn-iter"
version = "0.0.0"
description = "Module 4: iterative ProteinMPNN — loops sequence optimization against Rosetta and other sequence scorers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aapg-core",
    "aapg-toolkit",
    "proteinmpnn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aapg"]
